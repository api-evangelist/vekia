aid: vekia
name: Vekia
description: 'Vekia is a French supply-chain software vendor founded in 2008 in Lille
  by Manuel Davy (Vekia SAS, 143 rue d''Athènes, 59800 Lille, RCS Lille Métropole
  503 225 716). Its platform, Vekia Engine, applies probabilistic artificial intelligence
  and machine learning to demand and stock forecasting, then generates optimised purchase-order
  proposals that are pushed back into the customer''s existing ERP rather than replacing
  it, alongside shortage-risk alerting and a logistics control tower. Vekia Disrupt
  covers disruption and shortage management. The platform is hosted on Microsoft Azure
  in Europe and marketed to retail and specialised distribution, e-commerce, industry,
  energy and telecom, with published case studies at ENGIE, Mr Bricolage and Okaïdi.
  Vekia publishes no public API, no developer portal, no API reference and no machine-readable
  contract; ERP, WMS and TMS integration is delivered as a project by Vekia rather
  than through a self-serve developer surface.'
