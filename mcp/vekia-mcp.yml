x-scope-caveat: >-
  THIS IS NOT THE VEKIA PRODUCT API. The endpoint is the Model Context Protocol
  bridge exposed by the WordPress installation that serves the vekia.fr
  corporate site (WordPress MCP adapter pattern: /wp-json/mcp/... namespace,
  single `mcp` scope, WordPress-user OAuth, dynamic public client registration
  via client_id_metadata_document). It surfaces website/CMS content management
  to an authenticated WordPress user, not the Vekia Engine supply-chain
  forecasting and replenishment platform, which publishes no API documentation,
  no developer portal and no machine-readable contract at all.
